<!DOCTYPE html>
<html>

<head>
    <title>
        Blockchain Research Paper System
    </title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            text-align:center;
            padding-top:80px;
        }

        .container{
            width:500px;
            margin:auto;
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            color:#2c3e50;
        }

        p{
           color:#555;
           line-height:1.6;
        }

        input{
            margin-top:20px;
        }

        button{
            margin-top:20px;
            padding:12px 25px;
            background:#3498db;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#2980b9;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
    Blockchain-Based Research Paper
    Verification System
    </h1>

    <p>
    Securely upload research papers,
    analyze document similarity, and verify
    ownership using blockchain technology.
    </p>

        <form 
            action="/upload"
            method="POST"
            enctype="multipart/form-data"
        >

            <input 
                type="file"
                name="paper"
                required
            >

            <br>

            <button type="submit">
                Upload Paper
            </button>

        </form>

    </div>

</body>

</html>
